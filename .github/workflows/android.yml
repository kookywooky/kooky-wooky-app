name: Build KOOKY WOOKY APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name settings.gradle | head -n 1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOOKY-WOOKY-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
